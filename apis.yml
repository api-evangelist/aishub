name: AISHub
kind: company
description: AISHub is a cooperative AIS (Automatic Identification System) data
  sharing network for vessel tracking. Members who contribute a raw NMEA AIS feed
  from their own receiver (via UDP) get free access in return - a real-time
  aggregated feed from 1,500+ stations across 80 countries, plus an HTTP web
  service that returns vessel positions and station metadata as XML, JSON, or
  CSV. There is no pay-for-access tier; API credentials are earned by sharing a
  feed that meets coverage and uptime quality thresholds.
