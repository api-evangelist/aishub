meters:
- name: receiver_infrastructure
  description: Member-owned AIS receiving station costs - receiver, antenna, host device, power, connectivity. The real cost of AISHub access; no AISHub invoice.
  unit: hours
  aggregation: sum
  dimensions:
  - station
- name: contributed_feed_bandwidth
  description: Outbound bandwidth streaming the raw NMEA feed to AISHub over UDP.
  unit: bytes
  aggregation: sum
  dimensions:
  - station
- name: web_service_requests
  description: Polls of ws.php and stations.php (free; bounded by the documented once-per-minute limit).
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: downstream_processing
  description: Your own compute/storage for ingesting and processing the aggregated AIS data pulled from the web service or raw feed.
  unit: hours
  aggregation: sum
  dimensions:
  - workload
principles:
- name: Visibility
  description: Track receiver uptime and coverage against the AISHub quality thresholds - losing them means losing free API access, which is the real financial risk.
- name: Allocation
  description: Attribute receiver-station and processing costs to the internal workloads consuming the vessel data.
- name: Optimization
  description: Filter web service pulls with bounding box, MMSI/IMO, and interval parameters and use compression, so downstream processing and storage only handle needed vessels.
- name: Accountability
  description: Assign an owner for each receiving station responsible for keeping the contributed feed within quality thresholds.
