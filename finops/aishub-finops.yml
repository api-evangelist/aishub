description: >-
  FinOps view of AISHub. There is no vendor invoice - AISHub is a cooperative
  data-sharing network with a contribute-to-access model, so the cost of using
  the API is entirely in-kind and infrastructure-side. Members bear the cost of
  operating one or more AIS receiving stations (receiver hardware, antenna,
  hosting, power, bandwidth) and of streaming a raw NMEA feed to AISHub over
  UDP, plus whatever compute they use to poll and process the aggregated web
  service data. In exchange, access to the aggregated vessel-position and
  station data is free.
notes: >-
  There are no monetary meters to reconcile - AISHub publishes no pricing.
  The FOCUS columns below model the in-kind arrangement; the dominant
  real-world cost drivers are member-owned receiver infrastructure and the
  operational effort of keeping the feed above the quality thresholds
  (10+ vessels, 90%+ uptime rolling 7 days, <=10s delay) that continued API
  access depends on.
